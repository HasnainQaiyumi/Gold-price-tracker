name: Test & Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "17 */4 * * *" # refresh the "Why gold is moving" paragraph every 4 hours
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  models: read # GitHub Models (free) writes the news paragraph

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Build the "Why gold is moving" brief
        run: npx tsx scripts/news/build-brief.ts
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
