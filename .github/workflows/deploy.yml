name: Test & Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "50 3,11,19 * * *" # refresh "Gold explained" every 8 hours, ~10 min before each briefing (8am, 4pm, midnight Dubai)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - uses: actions/configure-pages@v5
        id: pages
      - name: Keep the last good brief in case a refresh fails
        run: mkdir -p public/data && curl -fsS "${{ steps.pages.outputs.base_url }}/data/brief.json" -o public/data/brief.json || true
      - name: Build the "Why gold is moving" brief
        run: npx tsx scripts/news/build-brief.ts
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} # optional, free from aistudio.google.com
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      - name: Keep the last good market data and prediction diary
        run: |
          curl -fsS "${{ steps.pages.outputs.base_url }}/data/market.json" -o public/data/market.json || true
          curl -fsS "${{ steps.pages.outputs.base_url }}/data/diary.json" -o public/data/diary.json || true
      - name: Restore the prediction diary backup
        uses: actions/cache/restore@v4
        with:
          path: .diary-state
          key: gold-diary-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: gold-diary-
      - name: Build 21-year gold history, traders' volatility and the prediction diary
        run: npx tsx scripts/data/build-market.ts
        continue-on-error: true
      - name: Save the prediction diary backup
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .diary-state
          key: gold-diary-${{ github.run_id }}-${{ github.run_attempt }}
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
