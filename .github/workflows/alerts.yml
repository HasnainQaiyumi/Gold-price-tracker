name: Gold price alerts (email + WhatsApp)

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test alert now"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: gold-alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Restore alert memory
        uses: actions/cache/restore@v4
        with:
          path: .alert-state
          key: gold-alert-state-${{ github.run_id }}
          restore-keys: gold-alert-state-
      - name: Check gold and send alerts
        run: npx tsx scripts/alerts/run.ts
        env:
          ALERT_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.test && '1' || '0' }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          ALERT_TARGETS: ${{ vars.ALERT_TARGETS }}
          ALERT_DAILY_MOVE: ${{ vars.ALERT_DAILY_MOVE }}
          DAILY_SUMMARY: ${{ vars.DAILY_SUMMARY }}
          DAILY_SUMMARY_HOUR: ${{ vars.DAILY_SUMMARY_HOUR }}
          WHATSAPP_QUIET_HOURS: ${{ vars.WHATSAPP_QUIET_HOURS }}
      - name: Save alert memory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .alert-state
          key: gold-alert-state-${{ github.run_id }}
